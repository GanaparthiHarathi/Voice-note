<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>History | VNote</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<style>
.page{
    padding:40px;
}

.glass-card{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
}
</style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark glass-nav">
<div class="container">

    <a href="/" class="navbar-brand fs-3 fw-bold">
        🎙️ VNote
    </a>

    <a href="/" class="btn btn-outline-light">
        Home
    </a>

</div>
</nav>

<!-- MAIN PAGE -->
<div class="container page">

<h1 class="text-center mb-4">
    Saved Notes History
</h1>

<!-- DELETE ALL HISTORY -->
<div class="text-end mb-3">
    <a href="/delete-all-history"
       class="btn btn-danger"
       onclick="return confirm('Are you sure you want to delete ALL history?')">
        🗑 Delete All History
    </a>
</div>

{% if notes %}

    {% for note in notes %}

    <div class="glass-card">

        <h5>Note #{{ note[0] }}</h5>

        <hr>

        <!-- ONLY FINAL OUTPUT -->
        <p>
            <strong>Output:</strong><br>
            {{ note[2] }}
        </p>

        <!-- CREATED DATE -->
        {% if note[4] %}

        <p>
            <strong>Audio:</strong><br>

            <audio controls>
                <source src="{{ url_for('static', filename=note[4]) }}">
            </audio>

        </p>

        {% endif %}

        <p>
            <strong>Created:</strong>
            {{ note[5] }}
        </p>

        <!-- DELETE BUTTON -->
        <a href="/delete/{{ note[0] }}"
           class="btn btn-sm btn-outline-danger"
           onclick="return confirm('Delete this note?')">
            🗑 Delete
        </a>

    </div>

    {% endfor %}

{% else %}

    <div class="alert alert-info text-center">
        No notes found.
    </div>

{% endif %}

</div>

</body>
</html>
