<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Voice To Note | VNote</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<style>
.page-container{
    padding:40px;
}

.glass-card{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    border-radius:20px;
    padding:25px;
}

textarea{
    resize:none;
}
</style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark glass-nav">
<div class="container">

    <a class="navbar-brand fs-3 fw-bold" href="/">
        🎙️ VNote
    </a>

    <a href="/" class="btn btn-outline-light">
        Home
    </a>

</div>
</nav>

<div class="container page-container">

<h1 class="text-center mb-4">
    Voice → Notes
</h1>

<div class="row g-4">

    <!-- LEFT SIDE -->
    <div class="col-lg-4">

        <div class="glass-card">

            <h4>Voice Input</h4>
            <hr>

            <form action="/upload-audio" method="POST" enctype="multipart/form-data">

                <label class="mb-2">Upload Audio File</label>

                <input type="file" name="audio" accept=".mp3,.wav,.m4a" class="form-control mb-3" required>

                <label class="mb-2">Input Language</label>

                <select name="input_language" class="form-select mb-3">
                    <option value="auto">Auto Detect</option>
                    <option value="en">English</option>
                    <option value="te">Telugu</option>
                    <option value="hi">Hindi</option>
                    <option value="ta">Tamil</option>
                    <option value="kn">Kannada</option>
                </select>

                <label class="mb-2">Output Language</label>

                <select name="target_language" class="form-select mb-3">
                    <option value="en">English</option>
                    <option value="te">Telugu</option>
                    <option value="hi">Hindi</option>
                    <option value="ta">Tamil</option>
                    <option value="kn">Kannada</option>
                </select>

                <button type="submit" class="btn btn-success w-100">
                    Generate Notes
                </button>

            </form>

            <hr>

            <button id="recordBtn" class="btn btn-danger w-100">
                <i class="fa-solid fa-microphone"></i> Start Recording
            </button>

            <br><br>

            <audio id="audioPreview" controls style="width:100%;display:none;"></audio>

            <form id="recordForm" action="/upload-audio" method="POST" enctype="multipart/form-data">
                <input type="file" id="audioFile" name="audio" hidden>
            </form>

        </div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="col-lg-8">

        <div class="glass-card">

            <h4>Generated Note</h4>
            <hr>

            {% if translated_text %}

            <label>Final Notes</label>

            <textarea id="noteText" class="form-control" rows="12">{{ translated_text }}</textarea>

            <br>

            {% endif %}

            <div class="row mt-3">

                <div class="col-md-6">
                    <div class="alert alert-info">
                        <strong>Detected Language:</strong>
                        {{ detected_language }}
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="alert alert-success">
                        <strong>Status:</strong>
                        Conversion Successful
                    </div>
                </div>

            </div>

            <!-- BUTTONS -->
            <div class="d-flex gap-2 flex-wrap">

                <!-- SAVE -->
                <form action="/save-note" method="POST">
                    <input type="hidden" name="original_text" value="{{ converted_text }}">
                    <input type="hidden" name="translated_text" value="{{ translated_text }}">
                    <button type="submit" class="btn btn-primary">
                        Save Note
                    </button>
                </form>

                <!-- COPY -->
                <button class="btn btn-secondary" onclick="copyText()">
                    📋 Copy
                </button>

                <!-- PDF -->
                <form action="/download-pdf" method="POST">
                    <input type="hidden" name="text" value="{{ translated_text }}">
                    <button type="submit" class="btn btn-danger">
                        📄 PDF
                    </button>
                </form>

                <!-- DOC -->
                <form action="/download-doc" method="POST">
                    <input type="hidden" name="text" value="{{ translated_text }}">
                    <button type="submit" class="btn btn-primary">
                        📄 DOC
                    </button>
                </form>

            </div>

        </div>

    </div>

</div>

</div>

<!-- SCRIPT -->
<script>

function copyText() {
    let textBox = document.getElementById("noteText");

    if (!textBox || textBox.value.trim() === "") {
        alert("Nothing to copy!");
        return;
    }

    navigator.clipboard.writeText(textBox.value);

    alert("Copied successfully!");
}

let recorder;
let audioChunks = [];

document.getElementById("recordBtn").addEventListener("click", async function(){

    if(!recorder){

        const stream = await navigator.mediaDevices.getUserMedia({ audio:true });

        recorder = new MediaRecorder(stream);

        recorder.ondataavailable = e => {
            audioChunks.push(e.data);
        };

        recorder.onstop = () => {

            const blob = new Blob(audioChunks, {type:"audio/wav"});

            const file = new File([blob], "recorded.wav");

            const dataTransfer = new DataTransfer();

            dataTransfer.items.add(file);

            document.getElementById("audioFile").files = dataTransfer.files;

            document.getElementById("recordForm").submit();
        };

        recorder.start();
        this.innerHTML = "Stop Recording";

    } else {

        recorder.stop();
        recorder = null;
        this.innerHTML = "Start Recording";

    }

});

</script>

</body>
</html>
